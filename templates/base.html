<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weapon Detection{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaed; --muted:#9aa3b2; --red:#ef4444; --green:#22c55e; --blue:#3b82f6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
    .flash { border-left:4px solid var(--red); }
    .ok { border-left:4px solid var(--green); }
    .alert { border-left:4px solid var(--red); }
    input[type=file] { width:100%; padding:28px; border:2px dashed var(--line); border-radius:10px; background:#11141a; color:var(--muted); }
    button, .btn { display:inline-block; margin-top:14px; padding:10px 18px; border:0; border-radius:8px; background:var(--blue); color:#fff; font:inherit; cursor:pointer; text-decoration:none; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px; }
    figure { margin:0; background:#11141a; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    figure img { width:100%; display:block; }
    figcaption { padding:10px 12px; font-size:13px; color:var(--muted); }
    code { background:#11141a; padding:2px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="card flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
